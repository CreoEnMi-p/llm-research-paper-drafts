name: Paper05 lexical binding and runtime scope reference
on:
  push:
    branches: [research/05-position-binding-scope]
    paths:
      - '05-attention-pointer-doubling/research-scope/test_scope_semantics.py'
      - '.github/workflows/paper05-scope-semantics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert CPython lexical binding and environment counterexamples
        run: python 05-attention-pointer-doubling/research-scope/test_scope_semantics.py
