name: Paper05 official trainable sparse occurrence k7 five-seed comparison
on:
  push:
    branches: [research/05-pointer-doubling-audit]
    paths: ['.github/workflows/paper05-occurrence-train.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { mode: "doubling", k: 4, seed: 0, freeze: 0 }
          - { mode: "doubling", k: 4, seed: 1, freeze: 0 }
          - { mode: "doubling", k: 4, seed: 2, freeze: 0 }
          - { mode: "doubling", k: 4, seed: 3, freeze: 0 }
          - { mode: "doubling", k: 4, seed: 4, freeze: 0 }
          - { mode: "recurrent", k: 4, seed: 0, freeze: 0 }
          - { mode: "recurrent", k: 4, seed: 1, freeze: 0 }
          - { mode: "recurrent", k: 4, seed: 2, freeze: 0 }
          - { mode: "recurrent", k: 4, seed: 3, freeze: 0 }
          - { mode: "recurrent", k: 4, seed: 4, freeze: 0 }
          - { mode: "doubling", k: 4, seed: 0, freeze: 1 }
          - { mode: "doubling", k: 4, seed: 1, freeze: 1 }
          - { mode: "doubling", k: 2, seed: 0, freeze: 0 }
          - { mode: "doubling", k: 2, seed: 1, freeze: 0 }
          - { mode: "doubling", k: 8, seed: 0, freeze: 0 }
          - { mode: "dense", k: 4, seed: 0, freeze: 0 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install official Sanford task requirements
        run: |
          python -m pip install -q numpy bidict
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          mkdir -p sanford-src/src
          curl -fsSL https://raw.githubusercontent.com/chsanford/hop-induction-heads/5735bca9545545774098994e21392b51b285bcc5/src/tasks.py -o sanford-src/src/tasks.py
      - name: Train terminal-only k7 and evaluate unseen lengths and k15
        working-directory: 05-attention-pointer-doubling
        env:
          SANFORD_REPO: ${{ github.workspace }}/sanford-src
          SANFORD_SHA: 5735bca9545545774098994e21392b51b285bcc5
          MODEL_MODE: ${{ matrix.mode }}
          TRAIN_SEED: ${{ matrix.seed }}
          KSPARSE: ${{ matrix.k }}
          FREEZE: ${{ matrix.freeze }}
        run: |
          extra=""
          if [ "$FREEZE" = 1 ]; then extra="--freeze-recency"; fi
          python audit/train_sparse_occurrence.py --mode "$MODEL_MODE" --k "$KSPARSE" --seed "$TRAIN_SEED" --steps 1000 --batch 48 --eval-every 200 --val-n 512 --init-temp 32 --init-recency 0 --lr 0.01 $extra --out "occ-${MODEL_MODE}-K${KSPARSE}-s${TRAIN_SEED}-f${FREEZE}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occurrence-${{ matrix.mode }}-K${{ matrix.k }}-s${{ matrix.seed }}-freeze${{ matrix.freeze }}
          path: 05-attention-pointer-doubling/occ-*.json
          retention-days: 30
