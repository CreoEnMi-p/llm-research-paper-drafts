name: Paper05 V3 locked model dev-only smoke
on:
  push:
    branches: [research/05-v3-pre-registered-20261123]
    paths: ['.github/workflows/paper05-v3-dev-smoke.yml']
permissions:
  contents: read
jobs:
  dev-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arm: [pointer, pointer-scrambled, pointer-canonical, candidate-classifier]
    defaults:
      run:
        working-directory: 05-attention-pointer-doubling/research-scope/v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned training environment
        run: |
          python -m pip install -q numpy==2.4.6
          python -m pip install -q torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Verify frozen test SHA/code identity, then DEV-ONLY train
        run: |
          python - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          lock=json.loads(Path('PROTOCOL_LOCK.json').read_text())
          man=json.loads(Path('FROZEN_MANIFEST.json').read_text())
          assert man['test_sha256']==lock['frozen_test']['expected_sha256']
          assert hashlib.sha256(Path('FROZEN_V3_448pairs.jsonl').read_bytes()).hexdigest()==man['test_sha256']
          assert subprocess.check_output(['git','hash-object','train_locked.py'],text=True).strip()==lock['training_script_git_blob']
          print('DEV_ONLY_CODE_LOCK_VERIFIED')
          PY
          python train_locked.py --arm ${{ matrix.arm }} --seed 0 --dev-only --out "DEVONLY_${{ matrix.arm }}.json"
          python - <<'PY'
          import glob,json
          path=glob.glob('DEVONLY_*.json')
          assert len(path)==1
          data=json.load(open(path[0]))
          assert data['steps']==5000 and len(data['development'])==3
          assert 'sealed_v3' not in data
          print('DEV_ONLY_SUCCESS',data['arm'],data['params'],data['development'][-1]['dev'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p05-v3-devonly-${{ matrix.arm }}
          path: 05-attention-pointer-doubling/research-scope/v3/DEVONLY_*.json
          retention-days: 20
