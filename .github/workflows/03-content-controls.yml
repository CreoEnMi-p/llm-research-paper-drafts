name: Audit 03 - content vs write strength
on:
  workflow_dispatch:
  push:
    branches:
      - research/03-oracle-audit-20261115
    paths:
      - '03-linear-attention-skip-lookups/audit_content.py'
      - '.github/workflows/03-content-controls.yml'
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU deps
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Matched content controls
        working-directory: 03-linear-attention-skip-lookups
        run: |
          set -o pipefail
          python audit_content.py | tee audit_content.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-control-results
          path: |
            03-linear-attention-skip-lookups/audit_content_summary.json
            03-linear-attention-skip-lookups/audit_content.log
          if-no-files-found: warn
