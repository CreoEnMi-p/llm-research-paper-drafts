name: Audit 03 - independent runner reproducibility
on:
  push:
    branches:
      - research/03-gemini-gate-audit-20261115
    paths:
      - '03-linear-attention-skip-lookups/audit_cross_host.py'
      - '.github/workflows/03-cross-host.yml'
  workflow_dispatch:
jobs:
  repeat:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2]
    env:
      AUDIT_WORKER: ${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: |
          python -m pip install numpy==2.4.6
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Repeat same seeded training on separate runner
        working-directory: 03-linear-attention-skip-lookups
        run: |
          set -o pipefail
          python audit_cross_host.py | tee audit_cross_host.log
      - name: Archive per-run reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-cross-host-${{ matrix.worker }}
          path: |
            03-linear-attention-skip-lookups/audit_cross_host.json
            03-linear-attention-skip-lookups/audit_cross_host.log
          if-no-files-found: warn
