name: Paper05 position-distribution soft doubling proof of concept
on:
  push:
    branches: [research/05-pointer-doubling-audit]
    paths: ['.github/workflows/paper05-soft-position-poc.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install -q numpy bidict
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          mkdir -p sanford-src/src
          curl -fsSL https://raw.githubusercontent.com/chsanford/hop-induction-heads/5735bca9545545774098994e21392b51b285bcc5/src/tasks.py -o sanford-src/src/tasks.py
      - name: Compare soft attention recurrence with and without occurrence state
        working-directory: 05-attention-pointer-doubling
        env:
          SANFORD_REPO: ${{ github.workspace }}/sanford-src
          SANFORD_SHA: 5735bca9545545774098994e21392b51b285bcc5
        run: |
          python -m py_compile audit/sanford_soft_positional_bln.py
          python audit/sanford_soft_positional_bln.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanford-soft-positional-pointer
          path: 05-attention-pointer-doubling/sanford_soft_position_pointer.json
          retention-days: 30
