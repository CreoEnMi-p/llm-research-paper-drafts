name: Paper05 occurrence pointer official smoke
on:
  push:
    branches: [research/05-pointer-doubling-audit]
    paths: ['05-attention-pointer-doubling/audit/train_sparse_occurrence.py','.github/workflows/paper05-occurrence-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install -q numpy bidict
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          mkdir -p sanford-src/src
          curl -fsSL https://raw.githubusercontent.com/chsanford/hop-induction-heads/5735bca9545545774098994e21392b51b285bcc5/src/tasks.py -o sanford-src/src/tasks.py
      - name: Smoke actual official label, position trace, loss and gradients
        working-directory: 05-attention-pointer-doubling
        env:
          SANFORD_REPO: ${{ github.workspace }}/sanford-src
          SANFORD_SHA: 5735bca9545545774098994e21392b51b285bcc5
        run: |
          python -m py_compile audit/train_sparse_occurrence.py
          python audit/train_sparse_occurrence.py --mode doubling --k 4 --seed 0 --steps 20 --batch 16 --val-n 64 --eval-every 10 --out occurrence-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occurrence-official-smoke
          path: 05-attention-pointer-doubling/occurrence-smoke.json
