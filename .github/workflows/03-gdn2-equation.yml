name: Audit 03 - channelwise independent erase-write equation control
on:
  push:
    branches:
      - research/03-gdn2-equation-control-20261115
    paths:
      - '03-linear-attention-skip-lookups/mix.py'
      - '03-linear-attention-skip-lookups/rc.py'
      - '03-linear-attention-skip-lookups/test_gdn2_equation.py'
      - '03-linear-attention-skip-lookups/audit_gdn2_equation.py'
      - '.github/workflows/03-gdn2-equation.yml'
  workflow_dispatch:
jobs:
  channelwise-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [mqar_rewrite, mqar_alias]
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU deps
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Algebraic and gradient tests
        working-directory: 03-linear-attention-skip-lookups
        run: |
          python -m py_compile mix.py rc.py test_gdn2_equation.py audit_gdn2_equation.py
          python -m unittest -v test_update_task.py test_gdn2_equation.py
      - name: Paired seed equation-control evaluation
        working-directory: 03-linear-attention-skip-lookups
        run: python audit_gdn2_equation.py --task ${{ matrix.task }} --seed ${{ matrix.seed }} | tee gdn2_equation_${{ matrix.task }}_${{ matrix.seed }}.log
      - name: Preserve raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdn2-equation-${{ matrix.task }}-seed${{ matrix.seed }}
          path: |
            03-linear-attention-skip-lookups/gdn2_equation_${{ matrix.task }}_${{ matrix.seed }}.log
            03-linear-attention-skip-lookups/gdn2_equation_${{ matrix.task }}_${{ matrix.seed }}.json
          if-no-files-found: warn
