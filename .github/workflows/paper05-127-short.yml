name: Paper05 k127/L7 short first-query falsification
on:
  push:
    branches: [research/05-pointer-doubling-audit]
    paths: ['.github/workflows/paper05-127-short.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { arm: "bln-oracle127", seed: 0, layers: 7, lr: 0.02, flags: "--eqh 2 --eqt 3 --ptr 11 --pnb 3 --pgi 8" }
          - { arm: "bln-oracle127", seed: 1, layers: 7, lr: 0.02, flags: "--eqh 2 --eqt 3 --ptr 11 --pnb 3 --pgi 8" }
          - { arm: "bln-learn127", seed: 0, layers: 7, lr: 0.02, flags: "--eqh 2 --eqt 3 --ptr 11 --pnb 3 --pgi 0" }
          - { arm: "rope9", seed: 0, layers: 9, lr: 0.04, flags: "" }
          - { arm: "onehop14", seed: 0, layers: 14, lr: 0.02, flags: "--eqh 1 --eqt 3 --ptr 1 --pnb 3" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install -q numpy
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: k127 reverse hopx first-query-only quick check
        working-directory: 05-attention-pointer-doubling
        env:
          FLAGS: ${{ matrix.flags }}
          TAG: short127-${{ matrix.arm }}-seed${{ matrix.seed }}
        run: |
          python audit/build_reviewer.py
          python pdg_reviewer_generated.py --dev cpu --threads 2 --task hopx --hops 127 --pairs 4 --tv 1024 --rev 1 --layers ${{ matrix.layers }} --steps 200 --batch 2 --init 0.5 --stop 0 --L 0 --nev 128 --ee 100 --eval_chunk 2 --index_every 100 --seed ${{ matrix.seed }} --lr ${{ matrix.lr }} --sink 0 --alibi 0 --first_only 1 $FLAGS --tag "$TAG"
          python - <<'PY'
          import json,os
          tag=os.environ['TAG']
          x=next(z for z in reversed([json.loads(line) for line in open('results.jsonl')]) if z['tag']==tag)
          with open(tag+'.json','w') as f: json.dump(x,f,indent=2)
          print('SHORT_127_FIRST='+json.dumps({k:x.get(k) for k in ['tag','first_acc','by_index','steps_run','train_s']}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short127-${{ matrix.arm }}-s${{ matrix.seed }}
          path: 05-attention-pointer-doubling/short127-*.json
          retention-days: 30
