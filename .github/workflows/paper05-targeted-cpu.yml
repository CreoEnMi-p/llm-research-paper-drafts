name: Paper 05 failed-k gate diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failed-hop-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: learned-14
            hops: 14
            layers: 4
            pairs: 8
            steps: 100
            hard: '0'
          - arm: hard-14
            hops: 14
            layers: 4
            pairs: 8
            steps: 100
            hard: '1'
          - arm: hard-18
            hops: 18
            layers: 5
            pairs: 4
            steps: 50
            hard: '1'
          - arm: hard-20
            hops: 20
            layers: 5
            pairs: 4
            steps: 50
            hard: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and NumPy
        run: |
          python -m pip install -q numpy
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run original model with/without hard binary gate initialization
        working-directory: 05-attention-pointer-doubling
        env:
          HARD: ${{ matrix.hard }}
          RUN_TAG: audit-${{ matrix.arm }}
        run: |
          python - <<'PY'
          import os
          p='pdg.py'
          src=open(p).read()
          if os.environ['HARD']=='1':
              needle='    m = Model(V, a.width, a.layers, a.heads).to(DEV)'
              assert needle in src
              new = (needle + '\n    with torch.no_grad():\n'
                     + '        m.S["pg"].copy_(torch.tensor([8.0 if ((a.hops >> l) & 1) else -8.0 for l in range(a.layers)], device=DEV))')
              src=src.replace(needle,new,1)
          open(p,'w').write(src)
          PY
          python pdg.py --dev cpu --threads 2 --task hopx --hops ${{ matrix.hops }} --pairs ${{ matrix.pairs }} --layers ${{ matrix.layers }} --rev 1 --steps ${{ matrix.steps }} --batch 16 --init 0.5 --stop 0.99 --L 0 --nev 256 --sink 0 --alibi 0 --eqh 2 --eqt 3 --ptr 11 --pnb 3 --lr 0.02 --tag "$RUN_TAG"
          python - <<'PY'
          import json,os
          rows=[json.loads(x) for x in open('results.jsonl')]
          r=next(r for r in reversed(rows) if r['tag']==os.environ['RUN_TAG'])
          print('GATE_RESULT=' + json.dumps({k:r.get(k) for k in ['tag','acc','steps90','curve','steps_run','val','train_s']}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper05-${{ matrix.arm }}
          path: 05-attention-pointer-doubling/results.jsonl
          retention-days: 7
