name: Paper05 corrected by-query and deep baseline pilot
on:
  push:
    branches: [research/05-pointer-doubling-audit]
    paths: ['05-attention-pointer-doubling/audit/build_reviewer.py','.github/workflows/paper05-indexed.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          - { arm: "rope", hops: 7, layers: 3, seed: 0, first: 0, flags: "--sink 0 --alibi 0", lr: 0.04 }
          - { arm: "nope", hops: 7, layers: 3, seed: 0, first: 0, flags: "--sink 0 --alibi 0 --nope 1", lr: 0.04 }
          - { arm: "bln", hops: 7, layers: 3, seed: 0, first: 0, flags: "--sink 0 --alibi 0 --eqh 2 --eqt 3 --ptr 11 --pnb 3", lr: 0.02 }
          - { arm: "ropeplus2", hops: 7, layers: 5, seed: 0, first: 0, flags: "--sink 0 --alibi 0", lr: 0.04 }
          - { arm: "nopeplus2", hops: 7, layers: 5, seed: 0, first: 0, flags: "--sink 0 --alibi 0 --nope 1", lr: 0.04 }
          - { arm: "onehopdeep", hops: 7, layers: 6, seed: 0, first: 0, flags: "--sink 0 --alibi 0 --eqh 1 --eqt 3 --ptr 1 --pnb 3", lr: 0.02 }
          - { arm: "rope", hops: 15, layers: 4, seed: 0, first: 0, flags: "--sink 0 --alibi 0", lr: 0.04 }
          - { arm: "bln", hops: 15, layers: 4, seed: 0, first: 0, flags: "--sink 0 --alibi 0 --eqh 2 --eqt 3 --ptr 11 --pnb 3", lr: 0.02 }
          - { arm: "ropeplus2", hops: 15, layers: 6, seed: 0, first: 0, flags: "--sink 0 --alibi 0", lr: 0.04 }
          - { arm: "nopeplus2", hops: 15, layers: 6, seed: 0, first: 0, flags: "--sink 0 --alibi 0 --nope 1", lr: 0.04 }
          - { arm: "onehopdeep", hops: 15, layers: 8, seed: 0, first: 0, flags: "--sink 0 --alibi 0 --eqh 1 --eqt 3 --ptr 1 --pnb 3", lr: 0.02 }
          - { arm: "bln_first", hops: 7, layers: 3, seed: 0, first: 1, flags: "--sink 0 --alibi 0 --eqh 2 --eqt 3 --ptr 11 --pnb 3", lr: 0.02 }
          - { arm: "rope_first", hops: 7, layers: 3, seed: 0, first: 1, flags: "--sink 0 --alibi 0", lr: 0.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU torch
        run: |
          python -m pip install -q numpy
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Execute 800-step pilot and capture by-query curves
        working-directory: 05-attention-pointer-doubling
        env:
          ARM_FLAGS: ${{ matrix.flags }}
          TAG: indexed-${{ matrix.arm }}-k${{ matrix.hops }}-s${{ matrix.seed }}
        run: |
          python audit/build_reviewer.py
          python -m py_compile pdg_reviewer_generated.py
          python pdg_reviewer_generated.py --dev cpu --threads 2 --task hopx --hops ${{ matrix.hops }} --pairs 8 --layers ${{ matrix.layers }} --rev 1 --steps 800 --batch 16 --init 0.5 --stop 0 --L 0 --nev 256 --ee 100 --index_every 100 --seed ${{ matrix.seed }} --lr ${{ matrix.lr }} --first_only ${{ matrix.first }} $ARM_FLAGS --tag "$TAG"
          python - <<'PY'
          import json,os
          tag=os.environ['TAG']
          r=next(r for r in reversed([json.loads(s) for s in open('results.jsonl')]) if r['tag']==tag)
          keys=['tag','acc','first_acc','by_index','chance_uniform_vocab','chance_elimination_by_query','chance_elimination_mean','steps_run','train_s','total_params','full_curve','index_curve','args']
          with open(tag+'.json','w') as f:json.dump({k:r.get(k) for k in keys},f,indent=2)
          print('INDEXED_FINAL='+json.dumps({k:r.get(k) for k in keys if k not in ('args','full_curve','index_curve')}),flush=True)
          print('INDEXED_CURVE='+json.dumps(r['index_curve']),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexed-${{ matrix.arm }}-k${{ matrix.hops }}-s${{ matrix.seed }}
          path: 05-attention-pointer-doubling/indexed-*.json
          retention-days: 30
