name: Paper05 matched onehop and doubling CPU step-cost profile
on:
  push:
    branches: [research/05-pointer-doubling-audit]
    paths: ['.github/workflows/paper05-onehop-cost.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install -q numpy
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Profile k7 and k15 at same microbatch with partial FLOPs
        working-directory: 05-attention-pointer-doubling
        run: |
          python audit/build_reviewer.py
          python audit/measure_cost_onehop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k7-k15-matched-cost
          path: 05-attention-pointer-doubling/audit/cost_matched_onehop.json
          retention-days: 30
