name: Paper05 long-training fair-baseline curves
on:
  push:
    branches: [research/05-pointer-doubling-audit]
    paths: ['05-attention-pointer-doubling/audit/build_fair.py','.github/workflows/paper05-fair-baselines.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - { arm: "rope", hops: 7, layers: 3, seed: 0, flags: "--sink 0 --alibi 0", lr: 0.04 }
          - { arm: "rope", hops: 7, layers: 3, seed: 1, flags: "--sink 0 --alibi 0", lr: 0.04 }
          - { arm: "rope", hops: 7, layers: 3, seed: 2, flags: "--sink 0 --alibi 0", lr: 0.04 }
          - { arm: "nope", hops: 7, layers: 3, seed: 0, flags: "--sink 0 --alibi 0 --nope 1", lr: 0.04 }
          - { arm: "nope", hops: 7, layers: 3, seed: 1, flags: "--sink 0 --alibi 0 --nope 1", lr: 0.04 }
          - { arm: "nope", hops: 7, layers: 3, seed: 2, flags: "--sink 0 --alibi 0 --nope 1", lr: 0.04 }
          - { arm: "bln", hops: 7, layers: 3, seed: 0, flags: "--sink 0 --alibi 0 --eqh 2 --eqt 3 --ptr 11 --pnb 3", lr: 0.02 }
          - { arm: "bln", hops: 7, layers: 3, seed: 1, flags: "--sink 0 --alibi 0 --eqh 2 --eqt 3 --ptr 11 --pnb 3", lr: 0.02 }
          - { arm: "bln", hops: 7, layers: 3, seed: 2, flags: "--sink 0 --alibi 0 --eqh 2 --eqt 3 --ptr 11 --pnb 3", lr: 0.02 }
          - { arm: "rope", hops: 15, layers: 4, seed: 0, flags: "--sink 0 --alibi 0", lr: 0.04 }
          - { arm: "rope", hops: 15, layers: 4, seed: 1, flags: "--sink 0 --alibi 0", lr: 0.04 }
          - { arm: "nope", hops: 15, layers: 4, seed: 0, flags: "--sink 0 --alibi 0 --nope 1", lr: 0.04 }
          - { arm: "nope", hops: 15, layers: 4, seed: 1, flags: "--sink 0 --alibi 0 --nope 1", lr: 0.04 }
          - { arm: "bln", hops: 15, layers: 4, seed: 0, flags: "--sink 0 --alibi 0 --eqh 2 --eqt 3 --ptr 11 --pnb 3", lr: 0.02 }
          - { arm: "bln", hops: 15, layers: 4, seed: 1, flags: "--sink 0 --alibi 0 --eqh 2 --eqt 3 --ptr 11 --pnb 3", lr: 0.02 }
          - { arm: "loop-nope", hops: 7, layers: 8, seed: 0, flags: "--sink 0 --alibi 0 --nope 1 --loop 1", lr: 0.04 }
          - { arm: "loop-pnb", hops: 7, layers: 8, seed: 0, flags: "--sink 0 --alibi 0 --nope 1 --loop 1 --eqh 2 --eqt 3 --ptr 3 --pnb 3", lr: 0.02 }
          - { arm: "loop-nope", hops: 15, layers: 8, seed: 0, flags: "--sink 0 --alibi 0 --nope 1 --loop 1", lr: 0.04 }
          - { arm: "loop-pnb", hops: 15, layers: 8, seed: 0, flags: "--sink 0 --alibi 0 --nope 1 --loop 1 --eqh 2 --eqt 3 --ptr 3 --pnb 3", lr: 0.02 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Torch CPU
        run: |
          python -m pip install -q numpy
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Generate instrumented original model; train to fixed 1200 steps
        working-directory: 05-attention-pointer-doubling
        env:
          ARM_FLAGS: ${{ matrix.flags }}
          NAME: fair-${{ matrix.arm }}-h${{ matrix.hops }}-l${{ matrix.layers }}-s${{ matrix.seed }}
        run: |
          python audit/build_fair.py
          python -m py_compile pdg_fair_generated.py
          python pdg_fair_generated.py --dev cpu --threads 2 --task hopx --hops ${{ matrix.hops }} --pairs 8 --layers ${{ matrix.layers }} --rev 1 --steps 1200 --batch 16 --init 0.5 --stop 0 --L 0 --nev 256 --ee 50 --seed ${{ matrix.seed }} --lr ${{ matrix.lr }} $ARM_FLAGS --tag "$NAME"
          python - <<'PY'
          import json, os
          r=next(r for r in reversed([json.loads(s) for s in open('results.jsonl')]) if r['tag']==os.environ['NAME'])
          keys=['tag','acc','val','steps_run','steps90','train_s','total_params','full_curve','args']
          out={k:r.get(k) for k in keys}
          with open(os.environ['NAME']+'.json','w') as f:json.dump(out,f,indent=2)
          print("FAIR_FINAL="+json.dumps({k:r.get(k) for k in keys if k not in ('full_curve','args')}))
          print("FAIR_CURVE="+json.dumps(r.get('full_curve')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fair-${{ matrix.arm }}-h${{ matrix.hops }}-l${{ matrix.layers }}-s${{ matrix.seed }}
          path: 05-attention-pointer-doubling/fair-*.json
          retention-days: 30
