name: Audit 03 - paired oracle counterexample
on:
  push:
    branches:
      - research/03-oracle-audit-20261115
    paths:
      - '03-linear-attention-skip-lookups/**'
      - '.github/workflows/03-oracle-audit.yml'
  workflow_dispatch:

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Audit paired seeds
        working-directory: 03-linear-attention-skip-lookups
        run: python audit_oracle.py | tee audit_oracle_run.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-audit-results
          path: |
            03-linear-attention-skip-lookups/audit_oracle_summary.json
            03-linear-attention-skip-lookups/audit_oracle_run.log
          if-no-files-found: warn
