name: Paper05 cold-random QK curriculum rescue
on:
  push:
    branches: [research/05-pointer-doubling-audit]
    paths: ['.github/workflows/paper05-sparse-curriculum.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { seed: 0, k: 4, warmup: 400, dense: 0 }
          - { seed: 1, k: 4, warmup: 400, dense: 0 }
          - { seed: 2, k: 4, warmup: 400, dense: 0 }
          - { seed: 0, k: 4, warmup: 400, dense: 1 }
          - { seed: 1, k: 4, warmup: 400, dense: 1 }
          - { seed: 2, k: 4, warmup: 400, dense: 1 }
          - { seed: 0, k: 8, warmup: 400, dense: 1 }
          - { seed: 0, k: 4, warmup: 800, dense: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install -q numpy bidict
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          mkdir -p sanford-src/src
          curl -fsSL https://raw.githubusercontent.com/chsanford/hop-induction-heads/5735bca9545545774098994e21392b51b285bcc5/src/tasks.py -o sanford-src/src/tasks.py
      - name: k1 terminal curriculum then k7 terminal training; no position oracle
        working-directory: 05-attention-pointer-doubling
        env:
          SANFORD_REPO: ${{ github.workspace }}/sanford-src
          SANFORD_SHA: 5735bca9545545774098994e21392b51b285bcc5
        run: |
          flag=""
          if [ ${{ matrix.dense }} = 1 ]; then flag="--dense-warmup"; fi
          python audit/train_sparse_occurrence.py --mode doubling --k ${{ matrix.k }} --seed ${{ matrix.seed }} --qk-init independent-random --warmup-onehop ${{ matrix.warmup }} $flag --steps 1600 --batch 48 --eval-every 200 --val-n 512 --lr 0.01 --out "curr-K${{ matrix.k }}-s${{ matrix.seed }}-w${{ matrix.warmup }}-d${{ matrix.dense }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curr-K${{ matrix.k }}-s${{ matrix.seed }}-w${{ matrix.warmup }}-d${{ matrix.dense }}
          path: 05-attention-pointer-doubling/curr-*.json
          retention-days: 30
