name: Paper05 executable semantic Python assignments and recency
on:
  push:
    branches: [research/05-pointer-doubling-audit]
    paths: ['05-attention-pointer-doubling/audit/semantic_assignments.py','05-attention-pointer-doubling/audit/build_semantic.py','.github/workflows/paper05-semantic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - { arm: "rope", seed: 0, layers: 4 }
          - { arm: "nope", seed: 0, layers: 4 }
          - { arm: "onehop", seed: 0, layers: 7 }
          - { arm: "bln", seed: 0, layers: 4 }
          - { arm: "bln-recent", seed: 0, layers: 4 }
          - { arm: "bln", seed: 1, layers: 4 }
          - { arm: "bln-recent", seed: 1, layers: 4 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install -q numpy
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Execute reference-verified program semantics training
        working-directory: 05-attention-pointer-doubling
        env:
          ARM: ${{ matrix.arm }}
          SEED: ${{ matrix.seed }}
        run: |
          python audit/build_semantic.py
          python -m py_compile pdg_semantic_generated.py audit/semantic_assignments.py
          python audit/semantic_assignments.py --arm "$ARM" --seed "$SEED" --layers ${{ matrix.layers }} --steps 1500 --batch 32 --eval_per_kind 96 --eval_every 150 --out "semantic-${ARM}-s${SEED}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-${{ matrix.arm }}-s${{ matrix.seed }}
          path: 05-attention-pointer-doubling/semantic-*.json
          retention-days: 30
