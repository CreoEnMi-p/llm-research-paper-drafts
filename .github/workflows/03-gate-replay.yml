name: Audit 03 - deterministic replay
on:
  push:
    branches:
      - research/03-gemini-gate-audit-20261115
    paths:
      - '03-linear-attention-skip-lookups/audit_replay.py'
      - '.github/workflows/03-gate-replay.yml'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Replay exact settings 1/2 threads
        working-directory: 03-linear-attention-skip-lookups
        run: |
          set -o pipefail
          python audit_replay.py | tee audit_replay.log
      - name: Archive replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-audit-replay
          path: |
            03-linear-attention-skip-lookups/audit_replay.json
            03-linear-attention-skip-lookups/audit_replay.log
          if-no-files-found: warn
