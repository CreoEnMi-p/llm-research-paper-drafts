name: Paper05 sparse position doubling vs onehop recurrence cost
on:
  push:
    branches: [research/05-pointer-doubling-audit]
    paths: ['.github/workflows/paper05-occurrence-cost.yml','05-attention-pointer-doubling/audit/occurrence_compute_profile.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install -q numpy bidict
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          mkdir -p sanford-src/src
          curl -fsSL https://raw.githubusercontent.com/chsanford/hop-induction-heads/5735bca9545545774098994e21392b51b285bcc5/src/tasks.py -o sanford-src/src/tasks.py
      - name: CPU same-runner k7 and k15 one-query fwd backward benchmark
        working-directory: 05-attention-pointer-doubling
        env:
          SANFORD_REPO: ${{ github.workspace }}/sanford-src
          SANFORD_SHA: 5735bca9545545774098994e21392b51b285bcc5
        run: |
          python -m py_compile audit/occurrence_compute_profile.py
          python audit/occurrence_compute_profile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occurrence-doubling-vs-recurrent-compute
          path: 05-attention-pointer-doubling/occurrence_cost.json
