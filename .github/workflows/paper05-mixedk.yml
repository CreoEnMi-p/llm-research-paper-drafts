name: Paper 05 mixed-hop query gating
on:
  push:
    branches: [research/05-pointer-doubling-audit]
    paths: ['05-attention-pointer-doubling/audit/build_mixedk.py', '.github/workflows/paper05-mixedk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mixed-hop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: global
            ctrl: 0
          - arm: gate-table
            ctrl: 1
          - arm: oracle-bits
            ctrl: 2
          - arm: content-gate
            ctrl: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch CPU
        run: |
          python -m pip install -q numpy
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Construct and train mixed-k model
        working-directory: 05-attention-pointer-doubling
        env:
          TAG: mixedk-${{ matrix.arm }}
        run: |
          python audit/build_mixedk.py
          python -m py_compile pdg_mixed_generated.py
          python pdg_mixed_generated.py --dev cpu --threads 2 --task hopx --hops 7 --pairs 8 --layers 3 --rev 1 --mixed 1 --ctrl ${{ matrix.ctrl }} --steps 150 --batch 16 --init 0.5 --L 0 --nev 256 --sink 0 --alibi 0 --eqh 2 --eqt 3 --ptr 11 --pnb 3 --lr 0.02 --tag "$TAG"
          python - <<'PY'
          import json, os
          r = next(x for x in reversed([json.loads(row) for row in open('results.jsonl')]) if x['tag'] == os.environ['TAG'])
          print("MIXED_FINAL=" + json.dumps({key:r.get(key) for key in ["tag","acc","steps90","curve","train_s","acc_by_hop","query_counts"]}))
          PY
