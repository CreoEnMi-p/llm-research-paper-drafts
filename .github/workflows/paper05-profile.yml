name: Paper05 same-runner CPU complexity profile
on:
  push:
    branches: [research/05-pointer-doubling-audit]
    paths: ['05-attention-pointer-doubling/audit/measure_cost.py','.github/workflows/paper05-profile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: |
          python -m pip install -q numpy
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compare same-runner forward/backward timing and partial FLOPs
        working-directory: 05-attention-pointer-doubling
        run: |
          python audit/build_fair.py
          python audit/measure_cost.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper05-cost-profile
          path: 05-attention-pointer-doubling/audit/cost_profile.json
          retention-days: 30
