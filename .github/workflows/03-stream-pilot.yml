name: Audit 03 - single strong-baseline stream competence pilot
on:
  push:
    branches:
      - research/03-interleaved-gated-pilot-20261115
    paths:
      - '03-linear-attention-skip-lookups/audit_stream_task.py'
      - '03-linear-attention-skip-lookups/audit_stream_eval.py'
      - '03-linear-attention-skip-lookups/test_stream_task.py'
      - '03-linear-attention-skip-lookups/rc.py'
      - '.github/workflows/03-stream-pilot.yml'
  workflow_dispatch:
jobs:
  delta-competence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU Torch and Numpy
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Static and oracle data tests (fail before training)
        working-directory: 03-linear-attention-skip-lookups
        run: |
          python -m py_compile rc.py audit_stream_task.py audit_stream_eval.py test_stream_task.py
          python -m unittest -v test_stream_task.py
      - name: Train ONLY one standard Delta Rule baseline until learnability gate
        working-directory: 03-linear-attention-skip-lookups
        run: |
          python rc.py --task mqar_stream --mix D --width 64 --layers 2 --heads 4 --L 96 --batch 24 --steps 1800 --pairs 4 --stream_writes 6 --stream_new 2 --stream_alias 0.5 --ee 100 --lr 0.05 --elr 0.04 --init 0.5 --alibi 0 --sink 0 --lpsX 1 --lpsC 16 --dev cpu --threads 2 --seed 0 --stream_pilot 1 --stream_ar_eval 1 --tag stream_D_learning_gate_seed0 | tee stream_pilot_D_seed0.log
      - name: Save validated evidence, no gate architectures trained
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-stream-learning-gate-seed0
          path: |
            03-linear-attention-skip-lookups/stream_pilot_D_seed0.log
            03-linear-attention-skip-lookups/results.jsonl
          if-no-files-found: warn
