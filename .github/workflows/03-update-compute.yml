name: Audit 03 - strong wall-time budget controls for memory updates
on:
  push:
    branches:
      - research/03-update-compute-matched-20261115
    paths:
      - '03-linear-attention-skip-lookups/audit_update_longbaseline.py'
      - '.github/workflows/03-update-compute.yml'
  workflow_dispatch:
jobs:
  compute-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [mqar_rewrite, mqar_alias]
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU deps
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test task and execute strong baselines
        working-directory: 03-linear-attention-skip-lookups
        run: |
          python -m unittest -v test_update_task.py
          python audit_update_longbaseline.py --task ${{ matrix.task }} --seed ${{ matrix.seed }} | tee update_compute_${{ matrix.task }}_${{ matrix.seed }}.log
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-compute-${{ matrix.task }}-seed${{ matrix.seed }}
          path: |
            03-linear-attention-skip-lookups/update_compute_${{ matrix.task }}_${{ matrix.seed }}.json
            03-linear-attention-skip-lookups/update_compute_${{ matrix.task }}_${{ matrix.seed }}.log
          if-no-files-found: warn
