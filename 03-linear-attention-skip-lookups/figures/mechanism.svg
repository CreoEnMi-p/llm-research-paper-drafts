<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <!-- panel a -->
  <rect x="12" y="12" width="420" height="376" rx="14" fill="#f5f7fa" stroke="#d5dbe3"/>
  <text x="28" y="38" font-weight="bold" font-size="14">(a) One position t: how strongly to write</text>
  <rect x="40" y="70" width="140" height="44" rx="8" fill="#dbe8fb" stroke="#2a78d6"/>
  <text x="110" y="90" text-anchor="middle">previous query</text>
  <text x="110" y="106" text-anchor="middle" font-style="italic">q(t-1)</text>
  <rect x="240" y="70" width="160" height="44" rx="8" fill="#dbe8fb" stroke="#2a78d6"/>
  <text x="320" y="90" text-anchor="middle">memory at chunk start</text>
  <text x="320" y="106" text-anchor="middle" font-style="italic">S_c</text>
  <rect x="140" y="150" width="160" height="40" rx="8" fill="#dbe8fb" stroke="#2a78d6"/>
  <text x="220" y="175" text-anchor="middle">read  r = S_c q(t-1)</text>
  <line x1="110" y1="114" x2="190" y2="148" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="320" y1="114" x2="250" y2="148" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="320" y="150" width="90" height="40" rx="8" fill="#e3f4ea" stroke="#1baf7a"/>
  <text x="365" y="175" text-anchor="middle">value v(t)</text>
  <rect x="120" y="225" width="290" height="48" rx="8" fill="#fde6dc" stroke="#eb6834"/>
  <text x="265" y="245" text-anchor="middle" font-weight="bold">gate = exp(-gamma relu(cos(r, v(t))))</text>
  <text x="265" y="263" text-anchor="middle" font-size="12">gamma learned per head, starts at 0.25</text>
  <line x1="220" y1="190" x2="230" y2="223" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="365" y1="190" x2="320" y2="223" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="80" y="308" width="330" height="48" rx="8" fill="#ece8fb" stroke="#6250d6"/>
  <text x="245" y="328" text-anchor="middle">write  S += gate x beta(t) x v(t) k(t)^T</text>
  <text x="245" y="346" text-anchor="middle" font-size="12">(delta-rule models: same gate on beta)</text>
  <line x1="265" y1="273" x2="250" y2="306" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <circle cx="30" cy="92" r="11" fill="#333"/><text x="30" y="97" fill="#fff" text-anchor="middle" font-size="12">1</text>
  <circle cx="122" cy="170" r="11" fill="#333"/><text x="122" y="175" fill="#fff" text-anchor="middle" font-size="12">2</text>
  <circle cx="102" cy="249" r="11" fill="#333"/><text x="102" y="254" fill="#fff" text-anchor="middle" font-size="12">3</text>
  <circle cx="62" cy="332" r="11" fill="#333"/><text x="62" y="337" fill="#fff" text-anchor="middle" font-size="12">4</text>
  <!-- panel b -->
  <rect x="448" y="12" width="440" height="376" rx="14" fill="#f5f7fa" stroke="#d5dbe3"/>
  <text x="464" y="38" font-weight="bold" font-size="14">(b) Across positions: recall with re-queries</text>
  <text x="464" y="70" font-size="12" fill="#52514e">stored pairs</text>
  <g font-size="14">
    <rect x="464" y="80" width="34" height="30" rx="5" fill="#dbe8fb"/><text x="481" y="100" text-anchor="middle">A</text>
    <rect x="502" y="80" width="34" height="30" rx="5" fill="#e3f4ea"/><text x="519" y="100" text-anchor="middle">7</text>
    <rect x="540" y="80" width="34" height="30" rx="5" fill="#dbe8fb"/><text x="557" y="100" text-anchor="middle">B</text>
    <rect x="578" y="80" width="34" height="30" rx="5" fill="#e3f4ea"/><text x="595" y="100" text-anchor="middle">3</text>
    <rect x="616" y="80" width="34" height="30" rx="5" fill="#dbe8fb"/><text x="633" y="100" text-anchor="middle">C</text>
    <rect x="654" y="80" width="34" height="30" rx="5" fill="#e3f4ea"/><text x="671" y="100" text-anchor="middle">9</text>
    <text x="700" y="100">...</text>
  </g>
  <line x1="740" y1="70" x2="740" y2="120" stroke="#999" stroke-dasharray="4 3"/>
  <text x="746" y="70" font-size="11" fill="#52514e">chunk boundary</text>
  <text x="464" y="150" font-size="12" fill="#52514e">later: queries, then the model writes the answer token</text>
  <g font-size="14">
    <rect x="464" y="160" width="34" height="30" rx="5" fill="#dbe8fb"/><text x="481" y="180" text-anchor="middle">A</text>
    <rect x="502" y="160" width="34" height="30" rx="5" fill="#e3f4ea" stroke="#eb6834" stroke-width="2"/><text x="519" y="180" text-anchor="middle">7</text>
    <rect x="540" y="160" width="34" height="30" rx="5" fill="#dbe8fb"/><text x="557" y="180" text-anchor="middle">C</text>
    <rect x="578" y="160" width="34" height="30" rx="5" fill="#e3f4ea" stroke="#eb6834" stroke-width="2"/><text x="595" y="180" text-anchor="middle">9</text>
    <rect x="616" y="160" width="34" height="30" rx="5" fill="#dbe8fb"/><text x="633" y="180" text-anchor="middle">B</text>
    <rect x="654" y="160" width="34" height="30" rx="5" fill="#e3f4ea"/><text x="671" y="180" text-anchor="middle">?</text>
  </g>
  <path d="M481,192 C481,220 519,220 519,194" fill="none" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="464" y="236" font-size="12">At "A" the read already returns 7. When "7" arrives,</text>
  <text x="464" y="252" font-size="12">cos(read, value) is high, so its write is mostly skipped (gate about 0.14).</text>
  <rect x="464" y="276" width="408" height="96" rx="8" fill="#ffffff" stroke="#d5dbe3"/>
  <text x="478" y="298" font-weight="bold" font-size="12">Without the gate</text>
  <text x="478" y="315" font-size="12">every answer is stored again, adding noise on top of B, C ...</text>
  <text x="478" y="340" font-weight="bold" font-size="12">With the gate</text>
  <text x="478" y="357" font-size="12">answer writes drop to about 14%; new pairs keep about 93%.</text>
</svg>
