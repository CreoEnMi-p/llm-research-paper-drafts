<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<!-- panel a -->
<rect x="15" y="15" width="430" height="350" rx="14" fill="#f5f6f8" stroke="#dde"/>
<text x="30" y="42" font-size="14" font-weight="bold" fill="#222">(a) Prediction vector = own part + group's shared part</text>
<text x="30" y="62" font-size="12" fill="#555">head[w] = own[w] + C[c(w)]   (one flat softmax over every word)</text>
<g font-size="13">
<rect x="40" y="85" width="120" height="34" rx="8" fill="#ffe3cc" stroke="#e58a3a"/><text x="100" y="107" text-anchor="middle">own["Monday"]</text>
<rect x="40" y="135" width="120" height="34" rx="8" fill="#ffe3cc" stroke="#e58a3a"/><text x="100" y="157" text-anchor="middle">own["Friday"]</text>
<rect x="40" y="185" width="120" height="34" rx="8" fill="#ffe3cc" stroke="#e58a3a"/><text x="100" y="207" text-anchor="middle">own["Thursdays"]</text>
<rect x="215" y="135" width="110" height="34" rx="8" fill="#d6e6fb" stroke="#2a78d6"/><text x="270" y="157" text-anchor="middle">C["days"]</text>
<line x1="160" y1="102" x2="213" y2="146" stroke="#333" marker-end="url(#ar)"/>
<line x1="160" y1="152" x2="213" y2="152" stroke="#333" marker-end="url(#ar)"/>
<line x1="160" y1="202" x2="213" y2="160" stroke="#333" marker-end="url(#ar)"/>
<rect x="345" y="85" width="85" height="134" rx="8" fill="#d8f2e6" stroke="#1baf7a"/>
<text x="387" y="140" text-anchor="middle">3 prediction</text><text x="387" y="157" text-anchor="middle">vectors</text><text x="387" y="174" text-anchor="middle">(logits)</text>
<line x1="325" y1="152" x2="343" y2="152" stroke="#333" marker-end="url(#ar)"/>
</g>
<circle cx="45" cy="262" r="11" fill="#2a78d6"/><text x="45" y="267" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">1</text>
<text x="64" y="259" font-size="12.5" fill="#222">"Monday" is a target 5,000 times; its gradient moves</text>
<text x="64" y="276" font-size="12.5" fill="#222">own["Monday"] and the shared C["days"].</text>
<circle cx="45" cy="312" r="11" fill="#2a78d6"/><text x="45" y="317" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
<text x="64" y="309" font-size="12.5" fill="#222">"Thursdays" is a target 15 times, but its vector moves with</text>
<text x="64" y="326" font-size="12.5" fill="#222">C["days"] at every step: it learns from its neighbours.</text>
<!-- panel b -->
<rect x="460" y="15" width="425" height="350" rx="14" fill="#f5f6f8" stroke="#dde"/>
<text x="475" y="42" font-size="14" font-weight="bold" fill="#222">(b) Every 50 steps: re-cluster, same function</text>
<text x="475" y="62" font-size="12" fill="#555">k-means (64 clusters) on the current vectors R = own + C</text>
<g font-size="12.5">
<rect x="485" y="85" width="120" height="50" rx="8" fill="#ffffff" stroke="#999"/><text x="545" y="107" text-anchor="middle">vectors R</text><text x="545" y="124" text-anchor="middle" fill="#555">(what predicts)</text>
<rect x="640" y="85" width="110" height="50" rx="8" fill="#e9e4fb" stroke="#6250d6"/><text x="695" y="107" text-anchor="middle">k-means</text><text x="695" y="124" text-anchor="middle" fill="#555">new c(w)</text>
<line x1="605" y1="110" x2="638" y2="110" stroke="#333" marker-end="url(#ar)"/>
<rect x="485" y="170" width="170" height="40" rx="8" fill="#d6e6fb" stroke="#2a78d6"/><text x="570" y="195" text-anchor="middle">C[k] = centroid of cluster k</text>
<rect x="680" y="170" width="185" height="40" rx="8" fill="#ffe3cc" stroke="#e58a3a"/><text x="772" y="195" text-anchor="middle">own[w] = R[w] - C[c(w)]</text>
<line x1="695" y1="135" x2="590" y2="168" stroke="#333" marker-end="url(#ar)"/>
<line x1="700" y1="135" x2="760" y2="168" stroke="#333" marker-end="url(#ar)"/>
</g>
<circle cx="490" cy="250" r="11" fill="#2a78d6"/><text x="490" y="255" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">3</text>
<text x="509" y="247" font-size="12.5" fill="#222">own + C equals R exactly, so the loss is the same</text>
<text x="509" y="264" font-size="12.5" fill="#222">before and after re-clustering.</text>
<circle cx="490" cy="300" r="11" fill="#2a78d6"/><text x="490" y="305" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">4</text>
<text x="509" y="297" font-size="12.5" fill="#222">Groups follow the vectors as they learn: words that are</text>
<text x="509" y="314" font-size="12.5" fill="#222">predicted by the same contexts end up sharing C.</text>
<text x="509" y="344" font-size="11.5" fill="#777">No extra cost at test time: fold C into the vectors.</text>
</svg>
