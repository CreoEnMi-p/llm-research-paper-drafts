<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#222">
  <rect width="900" height="360" fill="#fbfbf9"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>

  <!-- Panel A: step too short -->
  <text x="140" y="28" text-anchor="middle" font-weight="bold" font-size="15">A. Step too short</text>
  <path d="M30,80 Q140,300 250,80" fill="none" stroke="#8a8985" stroke-width="2"/>
  <circle cx="52" cy="122" r="7" fill="#52514e"/>
  <circle cx="94" cy="170" r="7" fill="#2a78d6"/>
  <path d="M58,127 L88,161" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="22" y="160" font-size="12" fill="#2a78d6">last step</text>
  <path d="M101,177 L124,196" stroke="#1baf7a" stroke-width="2.5" marker-end="url(#ag)" stroke-dasharray="5,3"/>
  <text x="112" y="214" font-size="12" fill="#1baf7a">downhill now</text>
  <text x="140" y="275" text-anchor="middle">same direction</text>
  <text x="140" y="295" text-anchor="middle" font-weight="bold" fill="#2a78d6">→ grow the rate</text>

  <!-- Panel B: step too long -->
  <text x="420" y="28" text-anchor="middle" font-weight="bold" font-size="15">B. Step too long</text>
  <path d="M310,80 Q420,300 530,80" fill="none" stroke="#8a8985" stroke-width="2"/>
  <circle cx="332" cy="122" r="7" fill="#52514e"/>
  <circle cx="500" cy="134" r="7" fill="#eb6834"/>
  <path d="M340,124 Q420,150 491,136" fill="none" stroke="#eb6834" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="392" y="128" font-size="12" fill="#eb6834">last step</text>
  <path d="M494,144 L476,168" stroke="#1baf7a" stroke-width="2.5" marker-end="url(#ag)" stroke-dasharray="5,3"/>
  <text x="482" y="186" font-size="12" fill="#1baf7a">downhill now</text>
  <text x="420" y="275" text-anchor="middle">opposite direction</text>
  <text x="420" y="295" text-anchor="middle" font-weight="bold" fill="#eb6834">→ shrink the rate</text>

  <!-- Panel C: the multiplier over training -->
  <text x="740" y="28" text-anchor="middle" font-weight="bold" font-size="15">C. Then hold it</text>
  <line x1="600" y1="240" x2="880" y2="240" stroke="#52514e" stroke-width="1.2" marker-end="url(#ak)"/>
  <line x1="600" y1="240" x2="600" y2="50" stroke="#52514e" stroke-width="1.2" marker-end="url(#ak)"/>
  <rect x="601" y="52" width="84" height="187" fill="#e8f1fb"/>
  <text x="643" y="68" text-anchor="middle" font-size="12" fill="#2a78d6">adapt</text>
  <text x="780" y="68" text-anchor="middle" font-size="12" fill="#52514e">hold</text>
  <line x1="685" y1="52" x2="685" y2="240" stroke="#c9c8c3" stroke-dasharray="4,3"/>
  <line x1="600" y1="150" x2="870" y2="150" stroke="#c9c8c3" stroke-dasharray="2,3"/>
  <text x="876" y="146" text-anchor="end" font-size="11" fill="#8a8985">best rate</text>
  <path d="M602,92 C625,135 650,148 685,151 L870,151" fill="none" stroke="#eb6834" stroke-width="2.5"/>
  <path d="M602,212 C625,160 650,152 685,149 L870,149" fill="none" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="610" y="86" font-size="11" fill="#eb6834">start 10x high</text>
  <text x="610" y="228" font-size="11" fill="#2a78d6">start 10x low</text>
  <text x="740" y="262" text-anchor="middle" font-size="12">training steps →</text>
  <text x="590" y="146" text-anchor="end" font-size="12" transform="rotate(-90 590 146)">rate</text>
  <text x="740" y="295" text-anchor="middle">both starts end near the best rate</text>

  <text x="450" y="340" text-anchor="middle" font-size="13" fill="#52514e">Check used: the cosine between the new gradient and the last update, averaged over all weight matrices.</text>
</svg>
